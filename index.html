<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dangi Brothers – Phones & Parts</title>
<style>
:root{--bg:#0e1330;--card:#171e47;--tx:#eef2ff;--mu:#9aa6d6;--ac:#ff6a3d;--ac2:#19c3b1}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
h1,h2,h3,.logo{font-family:Impact,"Arial Narrow Bold",sans-serif;letter-spacing:.5px;font-weight:400}
button,input,select{font:inherit;color:inherit}
input,select{background:var(--card);border:1px solid #ffffff22;border-radius:8px;padding:8px 10px;max-width:100%}
button{cursor:pointer;border:0;border-radius:8px;padding:8px 14px;background:var(--ac);color:#fff;font-weight:600}
button.g{background:#ffffff18}button.d{background:#c0392b}button:focus-visible,input:focus-visible{outline:2px solid var(--ac2)}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid #ffffff1a;display:flex;gap:10px;align-items:center;padding:10px 16px;flex-wrap:wrap}
.logo{font-size:26px;color:var(--ac);cursor:pointer}.logo b{color:var(--tx);font-weight:400}
#q{flex:1;min-width:140px}
.poster{margin:16px;border-radius:18px;padding:34px 28px;display:flex;justify-content:space-between;align-items:center;gap:16px;overflow:hidden}
.poster h1{font-size:clamp(34px,7vw,70px);line-height:1}.poster .tag{background:#fff;color:#111;padding:6px 14px;border-radius:30px;font-weight:800;display:inline-block;margin-top:12px}
.poster .em{font-size:clamp(60px,14vw,150px)}
.chips{display:flex;gap:8px;padding:0 16px;overflow-x:auto}.chips button{white-space:nowrap;background:var(--card)}.chips button.on{background:var(--ac)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;padding:16px}
.card{background:var(--card);border-radius:14px;overflow:hidden;position:relative;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1;object-fit:cover}.card div{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.card small{color:var(--mu)}.card .p{font-weight:800;font-size:17px}.card .p s{color:var(--mu);font-weight:400;font-size:13px}
.sale{position:absolute;top:10px;left:0;background:var(--ac);color:#fff;font-weight:800;padding:3px 10px 3px 8px;border-radius:0 20px 20px 0;font-size:12px}
.ov{position:fixed;inset:0;background:#000a;display:none;z-index:9;justify-content:center;align-items:center;padding:12px}.ov.on{display:flex}
.box{background:var(--bg);border:1px solid #ffffff22;border-radius:16px;padding:20px;width:min(520px,100%);max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.adm{display:flex;min-height:80vh}.side{width:150px;padding:12px;display:flex;flex-direction:column;gap:6px;border-right:1px solid #ffffff1a}.side button{background:none;text-align:left}.side button.on{background:var(--ac)}
.main{flex:1;padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px;min-width:0}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #ffffff14;text-align:left}td input{width:78px}td img{width:36px;height:36px;border-radius:6px}
.stat{background:var(--card);border-radius:12px;padding:16px;min-width:130px;flex:1}.stat b{font-size:28px;display:block}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ac2);color:#001;padding:10px 18px;border-radius:30px;font-weight:700;display:none;z-index:99}
@media(max-width:640px){.adm{flex-direction:column}.side{width:auto;flex-direction:row;overflow-x:auto;border:0}.poster{flex-direction:column;text-align:center}}
</style></head><body>
<div id="app"></div><div class="ov" id="ov"><div class="box" id="box"></div></div><div id="toast"></div>
<script>
const K='dbs_v1',$=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const EM={Phones:'📱',Screens:'🖥️',Batteries:'🔋',Chargers:'🔌',Cases:'🛡️','Back Panels':'🔲','Camera Modules':'📷',Earphones:'🎧'};
let D,U=null,V='shop',AT='dash',F={c:'All',q:''},AF='',cart=[],PO=null;
function svg(e,b){let h=0;for(const c of b||'x')h=(h*31+c.charCodeAt(0))%360;return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},65%,45%)"/><stop offset="1" stop-color="hsl(${(h+60)%360},70%,22%)"/></linearGradient></defs><rect width="200" height="200" fill="url(#g)"/><text x="100" y="125" font-size="78" text-anchor="middle">${e}</text></svg>`)}
const im=p=>p.img||svg(EM[p.cat]||'📦',p.brand),sp=p=>Math.round(p.price*(1-p.sale/100)),R=n=>'₹'+Number(n).toLocaleString('en-IN');
function seed(){
 const M=[['Apple','iPhone 17 Pro',129900],['Apple','iPhone 17',82900],['Apple','iPhone 16',69900],['Samsung','Galaxy S25 Ultra',129999],['Samsung','Galaxy S25',80999],['Samsung','Galaxy Z Fold6',164999],['Google','Pixel 10 Pro',109999],['OnePlus','OnePlus 13',69999],['Xiaomi','Xiaomi 15',64999],['Nothing','Phone (3)',79999],['Vivo','Vivo X200 Pro',94999],['Oppo','Find X8',69999]];
 const P=[['Screens',.18],['Batteries',.04],['Chargers',.03],['Cases',.02],['Back Panels',.05],['Camera Modules',.09],['Earphones',.05]];
 let id=1,pr=[];
 M.forEach(([b,n,p])=>{pr.push({id:id++,name:n,brand:b,cat:'Phones',price:p,stock:25,sale:0,img:''});P.forEach(([c,f])=>pr.push({id:id++,name:n+' '+c.replace(/s$/,''),brand:b,cat:c,price:Math.round(p*f/10)*10,stock:50,sale:0,img:''}))});
 pr.forEach((p,i)=>{if(i%7==3)p.sale=15});
 return{products:pr,nid:id,cats:Object.keys(EM),users:[{id:1,name:'Admin',email:'admin@dangibrothers.com',pass:'admin123',role:'admin',blocked:0}],orders:[],
 themes:[{n:'Midnight Orange',bg:'#0e1330',card:'#171e47',tx:'#eef2ff',mu:'#9aa6d6',ac:'#ff6a3d',ac2:'#19c3b1'},{n:'Daylight',bg:'#f4f7ff',card:'#ffffff',tx:'#14183a',mu:'#5b6490',ac:'#e8430f',ac2:'#0a8f81'},{n:'Ocean',bg:'#04202c',card:'#0a3445',tx:'#e6fbff',mu:'#8cc4d4',ac:'#ffc233',ac2:'#34d1ff'}],theme:0,
 poster:{on:1,title:'MEGA MOBILE SALE',sub:'Phones and every spare part, priced to move',tag:'UP TO 40% OFF',c1:'#ff6a3d',c2:'#7a2cff',emoji:'🔥'},set:{name:'Dangi Brothers',gw:'Razorpay',key:''}}}
function load(){try{D=JSON.parse(localStorage.getItem(K))}catch(e){}if(!D||!D.products)D=seed()}
const sv=()=>{try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}};
function t(m){const e=$('#toast');e.textContent=m;e.style.display='block';clearTimeout(t.h);t.h=setTimeout(()=>e.style.display='none',3200)}
function theme(){const x=D.themes[D.theme]||D.themes[0],s=document.documentElement.style;['bg','card','tx','mu','ac','ac2'].forEach(k=>s.setProperty('--'+k,x[k]))}
function modal(h){$('#box').innerHTML=h;$('#ov').classList.add('on')}
function close_(){$('#ov').classList.remove('on')}
$('#ov').onclick=e=>{if(e.target.id=='ov')close_()};
const v=id=>$(id).value;
function go(x){V=x;render()}
function render(){theme();document.title=D.set.name;
 const cn=cart.reduce((a,c)=>a+c.q,0);
 $('#app').innerHTML=`<header><span class="logo" onclick="go('shop')">${esc(D.set.name.split(' ')[0])} <b>${esc(D.set.name.split(' ').slice(1).join(' '))}</b></span>
 ${V=='shop'?`<input id="q" placeholder="Search phones, screens, batteries…" value="${esc(F.q)}" oninput="F.q=this.value;grid()">`:'<span style="flex:1"></span>'}
 ${U&&U.role=='admin'?`<button class="g" onclick="go('${V=='admin'?'shop':'admin'}')">${V=='admin'?'View store':'Admin panel'}</button>`:''}
 ${U?`<button class="g" onclick="myOrders()">Orders</button><button class="g" onclick="U=null;V='shop';render()">Log out (${esc(U.name)})</button>`:`<button class="g" onclick="authBox()">Log in</button>`}
 <button onclick="cartBox()">Cart (${cn})</button></header>`+(V=='admin'?admin():shop());
 if(V=='shop')grid()}
function shop(){const p=D.poster,cs=['All','On sale',...D.cats];
 return(p.on?`<div class="poster" style="background:linear-gradient(120deg,${p.c1},${p.c2})"><div><h1>${esc(p.title)}</h1><p>${esc(p.sub)}</p><span class="tag">${esc(p.tag)}</span></div><div class="em">${esc(p.emoji)}</div></div>`:'')+
 `<div class="chips">${cs.map(c=>`<button class="${F.c==c?'on':''}" onclick="F.c=this.textContent;render()">${esc(c)}</button>`).join('')}</div><div id="grid"></div>`}
function grid(){const q=F.q.toLowerCase();
 const L=D.products.filter(p=>(F.c=='All'||(F.c=='On sale'?p.sale>0:p.cat==F.c))&&(p.name+p.brand+p.cat).toLowerCase().includes(q));
 $('#grid').innerHTML=L.length?L.map(p=>`<div class="card">${p.sale?`<span class="sale">SALE ${p.sale}% OFF</span>`:''}<img src="${esc(im(p))}" alt="${esc(p.name)}" loading="lazy" onerror="this.onerror=null;this.src=svg('${EM[p.cat]||'📦'}','${esc(p.brand)}')"><div><small>${esc(p.brand)} · ${esc(p.cat)}</small><b>${esc(p.name)}</b><span class="p">${R(sp(p))} ${p.sale?`<s>${R(p.price)}</s>`:''}</span><button ${p.stock<1?'disabled':''} onclick="add(${p.id})">${p.stock<1?'Out of stock':'Add to cart'}</button></div></div>`).join(''):'<p>Nothing matches yet. Try another search or category.</p>'}
function add(id){const c=cart.find(x=>x.id==id);c?c.q++:cart.push({id,q:1});t('Added to cart');render()}
const total=()=>cart.reduce((a,c)=>a+sp(D.products.find(p=>p.id==c.id)||{price:0,sale:0})*c.q,0);
function cartBox(){modal(`<h2>Your cart</h2>${cart.length?cart.map(c=>{const p=D.products.find(x=>x.id==c.id);return`<div class="row"><span>${esc(p.name)} × ${c.q}</span><span>${R(sp(p)*c.q)} <button class="d" onclick="cart=cart.filter(x=>x.id!=${c.id});cartBox();render()">✕</button></span></div>`}).join('')+`<div class="row"><b>Total ${R(total())}</b><button onclick="checkout()">Checkout</button></div>`:'<p>Your cart is empty. Pick a phone or a part to start.</p>'}`)}
function checkout(){if(!U){authBox();return t('Log in to place your order')}
 modal(`<h2>Checkout · ${R(total())}</h2><input id="ad" placeholder="Full delivery address"><select id="pm"><option>Cash on delivery</option><option>Online (${esc(D.set.gw)})</option></select><button onclick="place()">Place order</button>`)}
function place(){if(!v('#ad').trim())return t('Enter your delivery address');const on=v('#pm').startsWith('Online');
 if(on&&!D.set.key)return t('Online payment is not set up yet. Choose cash on delivery.');
 cart.forEach(c=>{const p=D.products.find(x=>x.id==c.id);if(p)p.stock=Math.max(0,p.stock-c.q)});
 D.orders.push({id:'DB'+Date.now().toString().slice(-6),uid:U.id,user:U.name,items:cart.map(c=>({n:D.products.find(p=>p.id==c.id).name,q:c.q})),total:total(),addr:v('#ad'),pay:on?'Paid via '+D.set.gw:'COD',st:'Placed',d:new Date().toLocaleDateString()});
 cart=[];sv();close_();render();t('Order placed. Thank you!')}
function myOrders(){const o=D.orders.filter(x=>x.uid==U.id);modal(`<h2>Your orders</h2>${o.length?o.map(x=>`<div class="stat"><b style="font-size:16px">${x.id} · ${x.st}</b>${x.items.map(i=>esc(i.n)+' × '+i.q).join(', ')}<br>${R(x.total)} · ${x.pay}</div>`).join(''):'<p>No orders yet.</p>'}`)}
function authBox(m){m=m||'in';modal(`<h2>${m=='in'?'Log in':'Create account'}</h2>${m=='up'?'<input id="an" placeholder="Your name">':''}<input id="ae" type="email" placeholder="Email"><input id="apw" type="password" placeholder="Password"><button onclick="${m=='in'?'login()':'signup()'}">${m=='in'?'Log in':'Send OTP'}</button><button class="g" onclick="authBox('${m=='in'?'up':'in'}')">${m=='in'?'New here? Create account':'Have an account? Log in'}</button>`)}
function login(){const u=D.users.find(x=>x.email==v('#ae').trim().toLowerCase()&&x.pass==v('#apw'));if(!u)return t('Wrong email or password');if(u.blocked)return t('This account is blocked');U=u;close_();render();t('Welcome, '+u.name)}
function signup(){const e=v('#ae').trim().toLowerCase(),n=v('#an').trim(),p=v('#apw');if(!n||!e.includes('@')||p.length<6)return t('Enter name, valid email and 6+ character password');if(D.users.some(x=>x.email==e))return t('Email already registered');
 PO={n,e,p,o:String(1000+Math.floor(Math.random()*9000))};modal(`<h2>Enter OTP</h2><p style="color:var(--mu)">Demo mode: your OTP is <b>${PO.o}</b>. Real email OTP needs the backend step (see notes).</p><input id="ot" placeholder="4-digit OTP"><button onclick="verify()">Verify and sign up</button>`)}
function verify(){if(v('#ot')!=PO.o)return t('OTP does not match');const u={id:Date.now(),name:PO.n,email:PO.e,pass:PO.p,role:'user',blocked:0};D.users.push(u);U=u;sv();close_();render();t('Account created')}
/* ---------- ADMIN ---------- */
const TABS=[['dash','Dashboard'],['prod','Products'],['cat','Categories'],['ord','Orders'],['usr','Users'],['thm','Themes'],['pos','Sale poster'],['set','Payments & store']];
function admin(){const f={dash,prod,cat,ord,usr,thm,pos,set}[AT];return`<div class="adm"><div class="side">${TABS.map(([k,l])=>`<button class="${AT==k?'on':''}" onclick="AT='${k}';render()">${l}</button>`).join('')}</div><div class="main">${f()}</div></div>`}
function dash(){const rev=D.orders.reduce((a,o)=>a+o.total,0);return`<h2>Dashboard</h2><div class="row" style="justify-content:flex-start"><div class="stat"><b>${D.products.length}</b>Products</div><div class="stat"><b>${D.products.filter(p=>p.sale).length}</b>On sale</div><div class="stat"><b>${D.orders.length}</b>Orders</div><div class="stat"><b>${D.users.length}</b>Users</div><div class="stat"><b>${R(rev)}</b>Revenue</div></div>`}
function prod(){const q=AF.toLowerCase(),L=D.products.filter(p=>(p.name+p.cat).toLowerCase().includes(q));
 return`<h2>Products (${L.length})</h2><div class="row" style="justify-content:flex-start"><input placeholder="Filter, then press Enter" value="${esc(AF)}" onchange="AF=this.value;render()"></div>
 <div class="stat"><b style="font-size:16px">Add product</b><div class="row" style="justify-content:flex-start"><input id="pn" placeholder="Name"><input id="pb" placeholder="Brand"><select id="pc">${D.cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select><input id="pp" type="number" placeholder="Price"><input id="ps" type="number" placeholder="Stock"><input id="pi" placeholder="Photo URL (optional)"><button onclick="addP()">Add</button></div></div>
 <div style="overflow-x:auto"><table><tr><th></th><th>Name</th><th>Price</th><th>Sale %</th><th>Stock</th><th></th></tr>${L.slice(0,40).map(p=>`<tr><td><img src="${esc(im(p))}"></td><td>${esc(p.name)}<br><small>${esc(p.cat)}</small></td><td><input type="number" value="${p.price}" onchange="up(${p.id},'price',this.value)"></td><td><input type="number" value="${p.sale}" onchange="up(${p.id},'sale',this.value)"></td><td><input type="number" value="${p.stock}" onchange="up(${p.id},'stock',this.value)"></td><td><button class="g" onclick="ph(${p.id})">Photo</button> <button class="d" onclick="delP(${p.id})">Delete</button></td></tr>`).join('')}</table></div>${L.length>40?'<p>Showing first 40. Use the filter to find others.</p>':''}`}
function addP(){const n=v('#pn').trim(),p=+v('#pp');if(!n||!p)return t('Name and price are required');D.products.unshift({id:D.nid++,name:n,brand:v('#pb')||'Other',cat:v('#pc'),price:p,stock:+v('#ps')||0,sale:0,img:v('#pi').trim()});sv();render();t('Product added')}
function up(id,k,x){const p=D.products.find(a=>a.id==id);p[k]=Math.max(0,+x);if(k=='sale')p.sale=Math.min(90,p.sale);sv();t('Saved')}
function ph(id){const u=prompt('Paste photo URL (leave empty for default art):');if(u===null)return;D.products.find(a=>a.id==id).img=u.trim();sv();render()}
function delP(id){if(!confirm('Delete this product?'))return;D.products=D.products.filter(p=>p.id!=id);sv();render()}
function cat(){return`<h2>Categories</h2><div class="row" style="justify-content:flex-start"><input id="cn" placeholder="New category"><button onclick="addC()">Add</button></div>${D.cats.map(c=>`<div class="row stat">${EM[c]||'📦'} ${esc(c)} (${D.products.filter(p=>p.cat==c).length})<button class="d" onclick="delC('${esc(c)}')">Remove</button></div>`).join('')}`}
function addC(){const c=v('#cn').trim();if(!c||D.cats.includes(c))return t('Enter a new category name');D.cats.push(c);sv();render()}
function delC(c){if(!confirm('Remove category and all its products?'))return;D.cats=D.cats.filter(x=>x!=c);D.products=D.products.filter(p=>p.cat!=c);sv();render()}
function ord(){return`<h2>Orders</h2>${D.orders.length?D.orders.slice().reverse().map(o=>`<div class="stat">${o.id} · ${esc(o.user)} · ${R(o.total)} · ${esc(o.pay)}<br><small>${esc(o.addr)}</small><br><select onchange="D.orders.find(x=>x.id=='${o.id}').st=this.value;sv();t('Status updated')">${['Placed','Packed','Shipped','Delivered','Cancelled'].map(s=>`<option ${s==o.st?'selected':''}>${s}</option>`).join('')}</select></div>`).join(''):'<p>No orders yet. They appear here as customers check out.</p>'}`}
function usr(){return`<h2>Users</h2>${D.users.map(u=>`<div class="row stat"><span>${esc(u.name)} · ${esc(u.email)} · ${u.role}${u.blocked?' · blocked':''}</span>${u.role=='admin'?'':`<span><button class="g" onclick="blk(${u.id})">${u.blocked?'Unblock':'Block'}</button> <button class="d" onclick="D.users=D.users.filter(x=>x.id!=${u.id});sv();render()">Delete</button></span>`}</div>`).join('')}`}
function blk(id){const u=D.users.find(x=>x.id==id);u.blocked=u.blocked?0:1;sv();render()}
function thm(){return`<h2>Themes</h2>${D.themes.map((x,i)=>`<div class="row stat"><span>${esc(x.n)} ${i==D.theme?'(active)':''}</span><span><button onclick="D.theme=${i};sv();render()">Apply</button> ${D.themes.length>1?`<button class="d" onclick="D.themes.splice(${i},1);D.theme=0;sv();render()">Remove</button>`:''}</span></div>`).join('')}
 <div class="stat"><b style="font-size:16px">Add theme</b><div class="row" style="justify-content:flex-start"><input id="tn" placeholder="Theme name">${[['bg','Background','#101010'],['card','Cards','#1d1d1d'],['tx','Text','#ffffff'],['mu','Muted text','#aaaaaa'],['ac','Main colour','#ff3366'],['ac2','Second colour','#33ddaa']].map(([k,l,d])=>`<label>${l} <input type="color" id="t_${k}" value="${d}"></label>`).join('')}<button onclick="addT()">Add</button></div></div>`}
function addT(){const n=v('#tn').trim();if(!n)return t('Name your theme');const x={n};['bg','card','tx','mu','ac','ac2'].forEach(k=>x[k]=v('#t_'+k));D.themes.push(x);sv();render()}
function pos(){const p=D.poster;return`<h2>Sale poster</h2><div class="poster" style="margin:0;background:linear-gradient(120deg,${p.c1},${p.c2})"><div><h1>${esc(p.title)}</h1><p>${esc(p.sub)}</p><span class="tag">${esc(p.tag)}</span></div><div class="em">${esc(p.emoji)}</div></div>
 <div class="row" style="justify-content:flex-start"><input id="p1" value="${esc(p.title)}" placeholder="Title"><input id="p2" value="${esc(p.sub)}" placeholder="Subtitle"><input id="p3" value="${esc(p.tag)}" placeholder="Offer tag"><input id="p4" value="${esc(p.emoji)}" size="3"><input type="color" id="p5" value="${p.c1}"><input type="color" id="p6" value="${p.c2}"><label><input type="checkbox" id="p7" ${p.on?'checked':''}> Show on store</label><button onclick="savePo()">Save poster</button></div>
 <p style="color:var(--mu)">To put the SALE tag on a product, set its Sale % above 0 in Products.</p>`}
function savePo(){D.poster={title:v('#p1'),sub:v('#p2'),tag:v('#p3'),emoji:v('#p4'),c1:v('#p5'),c2:v('#p6'),on:$('#p7').checked?1:0};sv();render();t('Poster saved')}
function set(){return`<h2>Payments & store</h2><div class="stat"><div class="row" style="justify-content:flex-start"><input id="s1" value="${esc(D.set.name)}" placeholder="Store name"><select id="s2">${['Razorpay','Stripe','PayU','Cashfree','PhonePe'].map(g=>`<option ${g==D.set.gw?'selected':''}>${g}</option>`).join('')}</select><input id="s3" type="password" value="${esc(D.set.key)}" placeholder="Payment gateway key"><button onclick="saveS()">Save</button></div></div>
 <div class="stat"><b style="font-size:16px">Change admin password</b><div class="row" style="justify-content:flex-start"><input id="s4" type="password" placeholder="New password"><button onclick="U.pass=v('#s4');sv();t('Password changed')">Change</button></div></div>`}
function saveS(){D.set={name:v('#s1')||'Dangi Brothers',gw:v('#s2'),key:v('#s3')};sv();render();t('Settings saved')}
load();render();
</script></body></html>
