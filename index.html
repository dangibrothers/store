<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dangi Brothers | Mobile Spare Parts, Accessories & 3D Skin Studio</title>
<meta name="description" content="Dangi Brothers - Original & OEM Mobile Screens, Batteries, Charging Ports, Back Panels, Accessories & Custom 3M Skins." />
<script src="https://cdn.tailwindcss.com"></script>
<style>
:root{--p:#1d4ed8;--a:#f97316}
body{background:#f1f5f9;color:#0f172a;font-family:'Segoe UI',system-ui,sans-serif}
.no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
.bp{background:var(--p)}.ba{background:var(--a)}
.btn{padding:.5rem .9rem;border-radius:.75rem;font-weight:700;font-size:.8rem;color:#fff;background:var(--p)}
.inp{width:100%;border:1px solid #cbd5e1;border-radius:.75rem;padding:.5rem .75rem;font-size:.85rem;background:#fff}
.card{background:#fff;border-radius:1rem;border:1px solid #e2e8f0}
</style>
</head>
<body class="pb-16 md:pb-0">

<div id="offer" class="bp text-white text-xs sm:text-sm py-1.5 px-3 text-center font-semibold"></div>

<header class="sticky top-0 z-40 bg-white shadow-sm border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-3 py-2.5 flex items-center justify-between gap-2">
    <button onclick="go('home')" class="flex items-center gap-2 shrink-0">
      <div class="bp w-9 h-9 rounded-xl flex items-center justify-center text-white font-black">DB</div>
      <span id="storeName" class="font-black text-base sm:text-xl">Dangi Brothers</span>
    </button>
    <div class="flex-1 max-w-xl">
      <input id="gs" oninput="searchIn(this.value)" placeholder="Search iPhone 16 display, S24 battery..." class="inp bg-slate-100" />
    </div>
    <div class="flex items-center gap-1.5 text-xs font-bold">
      <button onclick="go('skin')" class="hidden sm:block px-3 py-2 rounded-xl bg-amber-50 text-amber-800 border border-amber-200">✨ Skins</button>
      <button onclick="go('track')" class="hidden lg:block px-2 py-2">📦 Track</button>
      <button onclick="go('cart')" class="p-2 rounded-xl bg-slate-100">🛒 <span id="cc" class="ba px-1.5 rounded-full text-white text-[10px]">0</span></button>
      <button id="authBtn" onclick="authOpen()" class="btn">Login</button>
      <button onclick="adminOpen()" class="px-2.5 py-2 rounded-xl bg-slate-900 text-emerald-400 font-black">🛡️</button>
    </div>
  </div>
  <div class="bg-slate-50 border-t overflow-x-auto no-scrollbar">
    <div id="strip" class="max-w-7xl mx-auto px-3 py-1.5 flex gap-4 text-xs font-bold text-slate-700 whitespace-nowrap"></div>
  </div>
</header>

<main id="app" class="max-w-7xl mx-auto px-3 py-4"></main>

<nav class="md:hidden fixed bottom-0 inset-x-0 z-40 bg-white border-t flex justify-around py-1.5 shadow-lg text-[11px] font-bold">
  <button onclick="go('home')">🏠<br>Home</button>
  <button onclick="go('catalog')">📱<br>Parts</button>
  <button onclick="go('skin')" class="text-amber-600">✨<br>Skins</button>
  <button onclick="go('cart')">🛒<br>Cart</button>
  <button onclick="go('track')">📦<br>Track</button>
</nav>

<footer class="bg-slate-900 text-slate-300 mt-12 text-xs">
  <div class="max-w-7xl mx-auto px-4 py-8 grid md:grid-cols-3 gap-6">
    <div><h3 class="text-white font-black text-lg mb-1">Dangi Brothers</h3>
      <p class="text-slate-400">India's trusted hub for Original & OEM mobile spare parts, accessories & laser-cut 3M skins.</p></div>
    <div><h4 class="text-white font-bold mb-2">Shop</h4>
      <div id="footCats" class="grid grid-cols-2 gap-1 text-slate-400"></div></div>
    <div><h4 class="text-white font-bold mb-2">Direct Technician Order</h4>
      <p class="text-slate-400 mb-3">Send your phone model photo on WhatsApp for exact-part matching.</p>
      <a id="waBtn" target="_blank" class="inline-block bg-emerald-600 text-white font-bold px-4 py-2.5 rounded-xl">💬 Order on WhatsApp</a></div>
  </div>
</footer>

<div id="modal" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-3 overflow-y-auto">
  <div class="bg-white rounded-3xl max-w-2xl w-full p-5 shadow-2xl relative my-auto max-h-[90vh] overflow-y-auto">
    <button onclick="closeM()" class="absolute right-4 top-4 bg-slate-100 w-8 h-8 rounded-full font-black">✕</button>
    <div id="mc"></div>
  </div>
</div>

<script>
// ---------- DATA ----------
const KEY = 'dangi_store_v2';
const CATS = ['Display / Screen','Battery','Charging Port','Back Panel','Cases & Glass','Chargers & Cables','Earphones & TWS','Power Banks'];
const PHOTO = {
 'Display / Screen':'photo-1592899677977-9c10ca588bbd','Battery':'photo-1609592424109-dd9892f1b17d',
 'Charging Port':'photo-1588508065123-287b28e013da','Back Panel':'photo-1616348436168-de43ad0db179',
 'Cases & Glass':'photo-1601593346740-925612772716','Chargers & Cables':'photo-1583863788434-e58a36330cf0',
 'Earphones & TWS':'photo-1590658268037-6bf12165a8df','Power Banks':'photo-1609091839311-d5365f9ff1c5'};
const MODELS = {
 'Apple':['iPhone 16 Pro Max','iPhone 16','iPhone 15','iPhone 14','iPhone 13','iPhone 12','iPhone 11'],
 'Samsung':['Galaxy S24 Ultra','Galaxy S24','Galaxy A55 5G','Galaxy A35 5G','Galaxy M35 5G'],
 'Vivo':['Vivo X100 Pro','Vivo V40 Pro','Vivo V30 Pro','Vivo T3 Pro 5G','Vivo Y200 5G'],
 'Oppo':['Oppo Reno 12 Pro','Oppo F27 Pro+ 5G','Oppo A3 Pro 5G'],
 'Realme':['Realme GT 6T','Realme 13 Pro+','Realme Narzo 70 Pro'],
 'Redmi / Xiaomi':['Xiaomi 14 Ultra','Redmi Note 13 Pro+','Redmi Note 13 5G','Poco X6 Pro 5G'],
 'OnePlus':['OnePlus 12','OnePlus 12R','OnePlus Nord 4'],
 'Nothing':['Nothing Phone (2)','Nothing Phone (2a)'],
 'Google Pixel':['Pixel 9 Pro XL','Pixel 8 Pro','Pixel 8a'],
 'Motorola':['Moto Edge 50 Pro','Moto G85 5G'],
 'iQOO':['iQOO 12 5G','iQOO Neo 9 Pro']};
const TPL = [
 ['Display / Screen','Super AMOLED / OLED Display Combo','Original',6499,9499,1],
 ['Display / Screen','Incell Touch Screen Folder','Compatible',1699,2999,1],
 ['Battery','High-Capacity Zero-Cycle Battery','Original',1199,1899,0],
 ['Charging Port','Fast-Charge Sub-Board Flex PCB','OEM',449,899,0],
 ['Back Panel','3D Gorilla Glass Back Housing','Original',799,1499,1],
 ['Cases & Glass','UV Curved Tempered Glass + Armor Case','OEM',299,699,1]];
const ACC = [
 ['Chargers & Cables','65W GaN Fast Charger + Type-C Cable','OEM',899,1599,1],
 ['Chargers & Cables','Braided Type-C Fast Charge Cable 1.5m','OEM',199,499,0],
 ['Earphones & TWS','Dangi Pro TWS Earbuds ENC','OEM',999,2499,1],
 ['Power Banks','20000mAh 22.5W Power Bank','OEM',1399,2299,0]];
const SKIN_MATERIALS = {'Carbon Fiber':'#1f2937','Matte Black':'#111827','Brushed Steel':'#9ca3af','Leather Brown':'#7c4a21','Wood Grain':'#a16207','Rose Gold':'#e9a8a0','Ocean Blue':'#1d4ed8'};
const THEMES = [['Royal Tech Blue','#1d4ed8','#f97316'],['Flipkart Style','#2874f0','#fb641b'],['Emerald','#047857','#f59e0b'],['Crimson Sale','#be123c','#eab308'],['Royal Purple','#6d28d9','#ec4899']];
const COUPONS = {DANGI50:{t:'flat',v:50,min:499}, SALE10:{t:'pct',v:10,min:999}};
const BANNERS = [
 {b:'🔥 MEGA SPARE PARTS SALE',t:'Original & OLED Displays for All Launched Phones',s:'iPhone 16, Galaxy S24 Ultra, Vivo X100, OnePlus 12 screens with 6-month warranty.',c:'Display / Screen',g:'from-blue-900 to-slate-900'},
 {b:'✨ 3D SKIN STUDIO',t:'Customize Your Phone Back in Carbon, Leather or Wood',s:'Laser-cut camera island preview for 40+ phones. Matte, glossy & textured 3M vinyl.',c:'SKIN',g:'from-purple-950 to-amber-900'},
 {b:'⚡ 100% TESTED BATTERIES',t:'Zero-Cycle Original & OEM Mobile Batteries',s:'BIS certified lithium-polymer batteries with free tool kit.',c:'Battery',g:'from-emerald-900 to-slate-900'}];

function build() {
  const list = []; let n = 100;
  for (const [brand, ms] of Object.entries(MODELS)) for (const m of ms) {
    const prem = /Pro|Ultra|16|15|12/.test(m);
    TPL.forEach((t, i) => list.push({
      id:'p'+(++n), title:`${m} ${t[1]}`, brand, model:m, cat:t[0], quality:t[2],
      price: Math.round(t[3]*(prem?1.35:1)), mrp: Math.round(t[4]*(prem?1.35:1)),
      stock: 18+i*4, sale: !!t[5],
      desc:`100% QC-tested ${t[2]} ${t[0]} for ${brand} ${m}. Anti-static packing & 6-month replacement warranty.`}));
  }
  ACC.forEach(t => list.push({id:'p'+(++n), title:t[1], brand:'Dangi Pro', model:'Universal', cat:t[0], quality:t[2],
    price:t[3], mrp:t[4], stock:60, sale:!!t[5], desc:'Universal accessory, tested and BIS compliant. 6-month warranty.'}));
  return list;
}
function fresh() {
  return {cfg:{name:'Dangi Brothers', wa:'919876543210', ship:49, freeAbove:499, offer:'🎉 GRAND SALE LIVE: Free Express Delivery above ₹499 + Use Code DANGI50 for ₹50 OFF!', upi:'yourname@upi', theme:0},
    products:build(), orders:[], users:[], cart:[], session:null, coupon:null};
}
let S; try { S = JSON.parse(localStorage.getItem(KEY)) || fresh(); } catch (e) { S = fresh(); }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };

// ---------- HELPERS ----------
const $ = id => document.getElementById(id);
const inr = n => '₹' + Number(n).toLocaleString('en-IN');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const off = p => Math.round((1 - p.price / p.mrp) * 100);
const img = p => `https://images.unsplash.com/${PHOTO[p.cat]}?auto=format&fit=crop&w=600&q=70`;
function fb(el, title) {
  el.onerror = null;
  el.src = 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="600" height="600" fill="#1e3a8a"/><text x="300" y="300" font-family="Arial" font-size="22" fill="#fff" text-anchor="middle">${esc(title.slice(0, 28))}</text></svg>`);
}
const F = {cat:'', brand:'', q:'', sort:''};
let view = 'home';

// ---------- THEME / CHROME ----------
function chrome() {
  const th = THEMES[S.cfg.theme] || THEMES[0];
  document.documentElement.style.setProperty('--p', th[1]);
  document.documentElement.style.setProperty('--a', th[2]);
  $('offer').textContent = S.cfg.offer; $('offer').style.display = S.cfg.offer ? '' : 'none';
  $('storeName').textContent = S.cfg.name;
  $('waBtn').href = `https://wa.me/${S.cfg.wa}?text=${encodeURIComponent('Hi ' + S.cfg.name + ', I need a mobile spare part')}`;
  $('cc').textContent = S.cart.reduce((a, c) => a + c.qty, 0);
  $('authBtn').textContent = S.session ? '👤 ' + S.session.name.split(' ')[0] : 'Login';
  $('strip').innerHTML = CATS.map(c => `<button onclick="cat('${c}')">${c}</button>`).join('') + `<button class="text-amber-600" onclick="go('skin')">✨ Skin Studio</button>`;
  $('footCats').innerHTML = CATS.slice(0, 5).map(c => `<button class="text-left hover:text-white" onclick="cat('${c}')">• ${c}</button>`).join('');
}
function go(v) { view = v; render(); scrollTo(0, 0); }
function cat(c) { F.cat = c; F.brand = ''; F.q = ''; go('catalog'); }
function searchIn(v) { F.q = v; if (view !== 'catalog') { view = 'catalog'; } render(); }

// ---------- RENDER ----------
function card(p) {
  return `<div class="card overflow-hidden flex flex-col">
    <div class="relative cursor-pointer" onclick="detail('${p.id}')">
      <img src="${img(p)}" loading="lazy" onerror="fb(this,'${esc(p.title)}')" class="w-full h-36 object-cover" alt="">
      ${p.sale ? `<span class="ba absolute top-2 left-2 text-white text-[10px] font-black px-2 py-0.5 rounded-full">${off(p)}% OFF</span>` : ''}
    </div>
    <div class="p-3 flex flex-col flex-1">
      <p class="text-[11px] text-slate-500 font-semibold">${esc(p.quality)} • ${esc(p.cat)}</p>
      <h3 class="text-xs sm:text-sm font-bold leading-snug mb-1 cursor-pointer" onclick="detail('${p.id}')">${esc(p.title)}</h3>
      <div class="mt-auto"><span class="font-black text-base">${inr(p.price)}</span> <span class="text-xs text-slate-400 line-through">${inr(p.mrp)}</span></div>
      <button onclick="add('${p.id}')" ${p.stock < 1 ? 'disabled' : ''} class="btn mt-2 w-full disabled:opacity-40">${p.stock < 1 ? 'Out of stock' : 'Add to Cart'}</button>
    </div></div>`;
}
function render() {
  chrome();
  const root = $('app');
  if (view === 'home') root.innerHTML = vHome();
  else if (view === 'catalog') root.innerHTML = vCatalog();
  else if (view === 'cart') root.innerHTML = vCart();
  else if (view === 'track') root.innerHTML = vTrack();
  else if (view === 'skin') { root.innerHTML = vSkin(); drawSkin(); }
  else if (view === 'admin') root.innerHTML = vAdmin();
  if (view === 'catalog' && document.activeElement !== $('gs')) {}
}
function vHome() {
  const sale = S.products.filter(p => p.sale && p.stock > 0).slice(0, 12);
  return `<div class="grid md:grid-cols-3 gap-3 mb-6">${BANNERS.map(b => `
    <div class="rounded-2xl p-5 text-white bg-gradient-to-br ${b.g}">
      <span class="text-[11px] font-bold bg-white/20 px-2 py-1 rounded-full">${b.b}</span>
      <h2 class="text-lg font-black mt-3 leading-tight">${b.t}</h2>
      <p class="text-xs text-white/80 mt-2 mb-4">${b.s}</p>
      <button onclick="${b.c === 'SKIN' ? "go('skin')" : `cat('${b.c}')`}" class="bg-white text-slate-900 font-bold text-xs px-4 py-2 rounded-xl">Shop Now →</button>
    </div>`).join('')}</div>
    <h2 class="font-black text-lg mb-3">Shop by Category</h2>
    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-8">${CATS.map(c => `<button onclick="cat('${c}')" class="card p-4 font-bold text-sm text-left hover:shadow-md">${c}</button>`).join('')}</div>
    <h2 class="font-black text-lg mb-3">🔥 Sale Picks</h2>
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">${sale.map(card).join('')}</div>`;
}
function vCatalog() {
  let l = S.products.filter(p => (!F.cat || p.cat === F.cat) && (!F.brand || p.brand === F.brand));
  if (F.q) { const q = F.q.toLowerCase(); l = l.filter(p => (p.title + p.brand + p.cat).toLowerCase().includes(q)); }
  if (F.sort === 'lo') l.sort((a, b) => a.price - b.price); else if (F.sort === 'hi') l.sort((a, b) => b.price - a.price);
  const total = l.length; l = l.slice(0, 60);
  return `<div class="flex flex-wrap gap-2 mb-4">
    <select class="inp !w-auto" onchange="F.cat=this.value;render()"><option value="">All categories</option>${CATS.map(c => `<option ${F.cat === c ? 'selected' : ''}>${c}</option>`).join('')}</select>
    <select class="inp !w-auto" onchange="F.brand=this.value;render()"><option value="">All brands</option>${[...Object.keys(MODELS), 'Dangi Pro'].map(b => `<option ${F.brand === b ? 'selected' : ''}>${b}</option>`).join('')}</select>
    <select class="inp !w-auto" onchange="F.sort=this.value;render()"><option value="">Sort</option><option value="lo" ${F.sort === 'lo' ? 'selected' : ''}>Price: Low → High</option><option value="hi" ${F.sort === 'hi' ? 'selected' : ''}>Price: High → Low</option></select>
  </div>
  <p class="text-xs text-slate-500 mb-2">${total} parts found${total > 60 ? ' (showing first 60 — refine your search)' : ''}</p>
  <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">${l.map(card).join('') || '<p class="col-span-full text-center py-12 text-slate-500">No parts found.</p>'}</div>`;
}
function detail(id) {
  const p = S.products.find(x => x.id === id); if (!p) return;
  $('mc').innerHTML = `<div class="grid sm:grid-cols-2 gap-4 pt-6">
    <img src="${img(p)}" onerror="fb(this,'${esc(p.title)}')" class="rounded-2xl w-full h-56 object-cover" alt="">
    <div><p class="text-xs text-slate-500 font-semibold">${esc(p.brand)} • ${esc(p.quality)}</p>
    <h2 class="font-black text-lg leading-snug my-1">${esc(p.title)}</h2>
    <div class="mb-2"><span class="font-black text-2xl">${inr(p.price)}</span> <span class="line-through text-slate-400">${inr(p.mrp)}</span> <span class="text-emerald-600 font-bold text-sm">${off(p)}% off</span></div>
    <p class="text-sm text-slate-600 mb-3">${esc(p.desc)}</p>
    <p class="text-xs mb-3 ${p.stock < 10 ? 'text-red-600' : 'text-emerald-600'} font-bold">${p.stock > 0 ? p.stock + ' in stock' : 'Out of stock'}</p>
    <button onclick="add('${p.id}');closeM()" class="btn w-full">Add to Cart</button></div></div>`;
  $('modal').classList.remove('hidden');
}
function closeM() { $('modal').classList.add('hidden'); }

// ---------- CART ----------
function add(id, extra) {
  const p = S.products.find(x => x.id === id); if (!p) return;
  const ex = S.cart.find(c => c.id === id && !c.skin);
  if (ex) ex.qty++; else S.cart.push({id, qty:1});
  save(); chrome(); toast('Added to cart');
}
function toast(m) {
  const t = document.createElement('div');
  t.textContent = m; t.className = 'fixed bottom-20 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-xs font-bold px-4 py-2 rounded-full z-50';
  document.body.appendChild(t); setTimeout(() => t.remove(), 1400);
}
function line(c) {
  if (c.skin) return {title: c.title, price: 299, img: null};
  const p = S.products.find(x => x.id === c.id); return p ? {title: p.title, price: p.price, p} : null;
}
function totals() {
  const sub = S.cart.reduce((a, c) => { const l = line(c); return a + (l ? l.price * c.qty : 0); }, 0);
  let disc = 0;
  if (S.coupon) { const k = COUPONS[S.coupon]; if (k && sub >= k.min) disc = k.t === 'flat' ? k.v : Math.round(sub * k.v / 100); }
  const ship = sub === 0 || sub >= S.cfg.freeAbove ? 0 : S.cfg.ship;
  return {sub, disc, ship, total: Math.max(0, sub - disc + ship)};
}
function qty(i, d) { S.cart[i].qty += d; if (S.cart[i].qty < 1) S.cart.splice(i, 1); save(); render(); }
function applyCoupon() {
  const c = $('cpn').value.trim().toUpperCase();
  if (COUPONS[c]) { S.coupon = c; save(); render(); } else toast('Invalid coupon');
}
function vCart() {
  if (!S.cart.length) return `<div class="card p-10 text-center"><p class="text-4xl mb-2">🛒</p><p class="font-bold mb-3">Your cart is empty</p><button onclick="go('catalog')" class="btn">Browse parts</button></div>`;
  const t = totals();
  return `<h1 class="font-black text-xl mb-3">Your Cart</h1><div class="grid lg:grid-cols-3 gap-4">
  <div class="lg:col-span-2 space-y-2">${S.cart.map((c, i) => { const l = line(c); if (!l) return ''; return `<div class="card p-3 flex items-center gap-3">
    <div class="flex-1"><p class="font-bold text-sm">${esc(l.title)}</p><p class="text-xs text-slate-500">${inr(l.price)} each</p></div>
    <div class="flex items-center gap-2"><button onclick="qty(${i},-1)" class="w-7 h-7 bg-slate-100 rounded-lg font-black">−</button><b>${c.qty}</b><button onclick="qty(${i},1)" class="w-7 h-7 bg-slate-100 rounded-lg font-black">+</button></div>
    <b class="w-20 text-right">${inr(l.price * c.qty)}</b></div>`; }).join('')}</div>
  <div class="card p-4 h-fit space-y-2 text-sm">
    <div class="flex gap-2"><input id="cpn" class="inp" placeholder="Coupon code" value="${S.coupon || ''}"><button onclick="applyCoupon()" class="btn">Apply</button></div>
    <div class="flex justify-between"><span>Subtotal</span><b>${inr(t.sub)}</b></div>
    ${t.disc ? `<div class="flex justify-between text-emerald-600"><span>Coupon (${S.coupon})</span><b>−${inr(t.disc)}</b></div>` : ''}
    <div class="flex justify-between"><span>Delivery</span><b>${t.ship ? inr(t.ship) : 'FREE'}</b></div>
    <div class="flex justify-between text-lg border-t pt-2"><span class="font-black">Total</span><b>${inr(t.total)}</b></div>
    <button onclick="checkout()" class="btn w-full !py-3">Checkout</button></div></div>`;
}
function checkout() {
  if (!S.session) { toast('Please login first'); return authOpen(); }
  const t = totals();
  $('mc').innerHTML = `<h2 class="font-black text-lg mb-3">Delivery & Payment</h2>
   <div class="space-y-2"><input id="ca" class="inp" placeholder="Full address with pincode" value="${esc(S.session.addr || '')}">
   <select id="cm" class="inp"><option value="COD">Cash on Delivery</option><option value="UPI">UPI (pay after placing order)</option></select>
   <p class="text-sm font-bold">Total payable: ${inr(t.total)}</p>
   <button onclick="placeOrder()" class="btn w-full !py-3">Place Order</button></div>`;
  $('modal').classList.remove('hidden');
}
function placeOrder() {
  const addr = $('ca').value.trim(); if (addr.length < 10) return toast('Enter full address');
  const t = totals(), method = $('cm').value;
  const items = S.cart.map(c => { const l = line(c); return {title: l.title, price: l.price, qty: c.qty, id: c.id}; });
  items.forEach(it => { const p = S.products.find(x => x.id === it.id); if (p) p.stock = Math.max(0, p.stock - it.qty); });
  const o = {id:'DB' + Date.now().toString().slice(-8), user:S.session.email, name:S.session.name, phone:S.session.phone, addr, items, total:t.total, method, status:'Placed', date:new Date().toISOString()};
  S.orders.unshift(o); S.cart = []; S.coupon = null; save();
  const upi = method === 'UPI' ? `<a class="btn inline-block mt-3" href="upi://pay?pa=${encodeURIComponent(S.cfg.upi)}&pn=${encodeURIComponent(S.cfg.name)}&am=${t.total}&cu=INR&tn=${o.id}">Pay ${inr(t.total)} via UPI</a>` : '';
  const msg = encodeURIComponent(`New order ${o.id}\n${items.map(i => i.qty + 'x ' + i.title).join('\n')}\nTotal: ₹${t.total} (${method})\nAddress: ${addr}`);
  $('mc').innerHTML = `<div class="text-center py-4"><p class="text-4xl">✅</p><h2 class="font-black text-lg">Order placed!</h2><p class="text-sm">Order ID: <b>${o.id}</b></p>${upi}
   <div class="mt-3"><a target="_blank" href="https://wa.me/${S.cfg.wa}?text=${msg}" class="inline-block bg-emerald-600 text-white font-bold text-sm px-4 py-2 rounded-xl">Confirm on WhatsApp</a></div></div>`;
  render();
}
function vTrack() {
  return `<div class="card p-5 max-w-md mx-auto"><h1 class="font-black text-lg mb-3">📦 Track Order</h1>
  <div class="flex gap-2"><input id="tid" class="inp" placeholder="Order ID e.g. DB12345678"><button class="btn" onclick="trackIt()">Track</button></div><div id="tres" class="mt-4 text-sm"></div></div>`;

function drawSkin() {

   <rect x="10" y="10" width="200" height="420" rx="34" fill="url(#sh)" opacity=".25"/>
   <defs><linearGradient id="sh" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient></defs>

// ---------- AUTH (demo, device-local) ----------
let authMode = 'login';
function authOpen() {
  if (S.session) {
    $('mc').innerHTML = `<h2 class="font-black text-lg mb-2">👤 ${esc(S.session.name)}</h2><p class="text-sm text-slate-500 mb-3">${esc(S.session.email)}</p>
     <h3 class="font-bold text-sm mb-1">My orders</h3><div class="space-y-1 text-xs mb-4">${S.orders.filter(o => o.user === S.session.email).map(o => `<p>${o.id} — ${o.status} — ${inr(o.total)}</p>`).join('') || 'No orders yet.'}</div>
     <button onclick="logout()" class="btn !bg-slate-700">Logout</button>`;
  } else {
    $('mc').innerHTML = `<h2 class="font-black text-lg mb-3">${authMode === 'login' ? 'Login' : 'Create account'}</h2><div class="space-y-2">
     ${authMode === 'signup' ? '<input id="an" class="inp" placeholder="Full name"><input id="ap" class="inp" placeholder="Mobile number" inputmode="numeric">' : ''}
     <input id="ae" class="inp" type="email" placeholder="Email"><input id="aw" class="inp" type="password" placeholder="Password (min 6 chars)">
     <button onclick="authGo()" class="btn w-full !py-3">${authMode === 'login' ? 'Login' : 'Sign up'}</button>
     <button class="text-xs text-blue-600 font-bold" onclick="authMode=authMode==='login'?'signup':'login';authOpen()">${authMode === 'login' ? 'New here? Create account' : 'Have an account? Login'}</button></div>`;
  }
  $('modal').classList.remove('hidden');
}
async function hash(s) { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join(''); }
async function authGo() {
  const email = $('ae').value.trim().toLowerCase(), pw = $('aw').value;
  if (!/^\S+@\S+\.\S+$/.test(email) || pw.length < 6) return toast('Valid email & 6+ char password');
  const h = await hash(pw);
  if (authMode === 'signup') {
    const name = $('an').value.trim(), phone = $('ap').value.trim();
    if (!name || !/^\d{10}$/.test(phone)) return toast('Enter name & 10-digit mobile');
    if (S.users.some(u => u.email === email)) return toast('Email already registered');
    const u = {name, email, phone, h}; S.users.push(u); S.session = u;
  } else {
    const u = S.users.find(u => u.email === email && u.h === h);
    if (!u) return toast('Wrong email or password'); S.session = u;
  }
  save(); closeM(); render();
}
function logout() { S.session = null; save(); closeM(); render(); }
